    <style>
        body {
            background-color: #131313;
            background-image: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 50%), linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
            background-attachment: fixed;
            color: #e5e2e1;
            padding-bottom: 90px;
        }

        .glass-panel {
            background: rgba(28, 27, 27, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px rgba(255, 255, 255, 0.05)
        }

        .neon-text-glow {
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.7)
        }

        .gold-glow {
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.5)
        }

        .calling-card-bg {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBRnhQxEg_crF-Bcs1QExvi-hanffuo1kYZsOONmp8w90ES5yg_hdEEXFSRl7B0BLIlZ8_Tm6EugWIeasLf6NoGCvyQ9v19chz3gqO-nNeogDro5nqCldDDl9L-60FiOmK3I2rAOoAYVD952d7KA81U4zMnL3hMYZC5gyCE2tZJTQ0imfe1EPMMno87gCvCb7myrrJrmBd-TOaEeU5TS1SvNr94tLecWj-3slEr7IrFp2DolVantne6rtniW1nQihmIQ9FEOjBTbHMA);
            background-size: cover;
            background-position: center;
            position: relative
        }

        .calling-card-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(19, 19, 19, 0.2) 0%, rgba(19, 19, 19, 0.9) 100%);
            z-index: 1
        }

        .hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)
        }

        .clip-path-shield {
            clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
        }

        @keyframes pulse-glow {

            0%,
            100% {
                filter: drop-shadow(0 0 5px rgba(139, 92, 246, 0.5));
                transform: scale(1.1);
            }

            50% {
                filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.9));
                transform: scale(1.15);
            }
        }

        .nav-active {
            animation: pulse-glow 2s infinite ease-in-out
        }
    </style>
