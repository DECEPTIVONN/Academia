    <style>
        body {
            background-color: #0a0514;
            color: #e5e2e1;
        }

        /* Shared Properties */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @property --glow-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* Keyframes */
        @keyframes rotateAngle {
            to {
                --angle: 360deg;
            }
        }

        @keyframes rotateGlowAngle {
            to {
                --glow-angle: 360deg;
            }
        }

        @keyframes matrixScan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes frostSpread {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        @keyframes goldFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes spiral {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes hazardPulse {
            0% {
                opacity: 0.1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 0.1;
            }
        }

        /* New High-Fidelity Keyframes */
        @keyframes lightningPulse {

            0%,
            100% {
                opacity: 0.8;
                filter: drop-shadow(0 0 10px #0ff);
            }

            50% {
                opacity: 1;
                filter: drop-shadow(0 0 20px #0ff);
                transform: scaleY(1.02);
            }

            70%,
            75% {
                opacity: 0;
            }
        }

        @keyframes solarEruption {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.2) rotate(10deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(-5deg);
                opacity: 0.8;
            }
        }

        @keyframes singularitySpin {
            from {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }

            to {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes eventHorizon {

            0%,
            100% {
                box-shadow: inset 0 0 50px #000, 0 0 30px #6d28d9, 0 0 80px #c084fc;
            }

            50% {
                box-shadow: inset 0 0 80px #000, 0 0 50px #6d28d9, 0 0 120px #c084fc;
            }
        }

        @keyframes toxicFumes {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translate(-20px, -10px) scale(1.2);
                opacity: 0.6;
            }

            100% {
                transform: translate(10px, -20px) scale(1);
                opacity: 0.3;
            }
        }

        @keyframes pulseSymbol {

            0%,
            100% {
                opacity: 0.3;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        @keyframes vampiricHeartbeat {

            0%,
            100% {
                background-color: #1a0505;
            }

            15% {
                background-color: #3f0000;
                box-shadow: inset 0 0 100px #7f0000;
            }

            30% {
                background-color: #1a0505;
            }

            45% {
                background-color: #4a0000;
                box-shadow: inset 0 0 120px #990000;
            }
        }

        @keyframes warpSpeed {
            0% {
                transform: scale(1);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        @keyframes rotateCosmic {
            to {
                transform: rotate(360deg);
            }
        }

        /* Thematic Additions */
        @keyframes abyssalEye {

            0%,
            100% {
                opacity: 0;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        @keyframes tentacleWrithe {

            0%,
            100% {
                transform: rotate(-5deg) translateY(0);
            }

            50% {
                transform: rotate(5deg) translateY(-10px);
            }
        }

        @keyframes viralPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        @keyframes dnaScroll {
            to {
                background-position: 100px 100px, 0 0;
            }
        }

        /* New 5 Animations */
        @keyframes lavaFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes risingEmbers {
            0% {
                transform: translateY(100%) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 1;
                transform: translateY(0%) scale(1.5);
            }

            100% {
                transform: translateY(-100%) scale(0.5);
                opacity: 0;
            }
        }

        @keyframes heatDistort {

            0%,
            100% {
                filter: contrast(1.2);
            }

            50% {
                filter: contrast(1.5) saturate(1.2);
            }
        }

        @keyframes glitchTear {

            0%,
            100% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                transform: translate(0);
            }

            10% {
                clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%);
                transform: translate(-2px, 2px);
            }

            20% {
                clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
                transform: translate(2px, -2px);
            }

            30% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                transform: translate(0);
            }
        }

        @keyframes cyberPulseLines {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 100%;
            }
        }

        @keyframes lightningStrike {

            0%,
            90%,
            94%,
            98%,
            100% {
                opacity: 0;
            }

            92%,
            96% {
                opacity: 1;
                background: #fff;
                filter: drop-shadow(0 0 20px #bfdbfe);
            }
        }

        @keyframes stormClouds {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        @keyframes singularityPull {
            0% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.2) rotate(180deg);
            }

            100% {
                transform: scale(1) rotate(360deg);
            }
        }

        @keyframes particleSuck {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }

            100% {
                transform: scale(0) translate(50%, 50%);
                opacity: 0;
            }
        }

        @keyframes dragonBlink {

            0%,
            95%,
            100% {
                transform: scaleY(1);
                opacity: 0.8;
            }

            97% {
                transform: scaleY(0.1);
                opacity: 1;
            }
        }

        @keyframes toxicMist {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -200px 50px;
            }
        }

        /* Master Tier Animations */
        @keyframes blueFire {
            0% {
                background-position: 0% 100%;
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }

            100% {
                background-position: 0% 0%;
                opacity: 0.8;
            }
        }

        @keyframes smokeDrift {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-50px) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes neonSlash {
            0% {
                transform: translateX(-150%) skewX(-45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            30% {
                transform: translateX(150%) skewX(-45deg);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes staticGlitch {
            0% {
                opacity: 0.1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.1;
            }
        }

        @keyframes pulseFluid {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes solarCorona {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.1) rotate(180deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(360deg);
                opacity: 0.8;
            }
        }

        @keyframes scanLine {
            0% {
                top: 0%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        @keyframes creepingFrost {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            100% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        @keyframes ashFall {
            0% {
                transform: translateY(-10px) translateX(0);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(100px) translateX(20px);
                opacity: 0;
            }
        }

        @keyframes tunnelWarp {
            0% {
                transform: scale(1) rotate(0deg);
            }

            100% {
                transform: scale(2) rotate(360deg);
            }
        }

        @keyframes runeGlow {

            0%,
            100% {
                opacity: 0.3;
                text-shadow: 0 0 5px #f59e0b;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 20px #f59e0b, 0 0 40px #f59e0b;
            }
        }


        .arena-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(10, 5, 20, 0.8) 0%, #0a0514 100%);
            pointer-events: none;
        }

        .banner-base {
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Themes --- */
        /* 1. Roxo Neon */
        .theme-roxo-neon {
            background: linear-gradient(135deg, #2e1065 0%, #4c1d95 50%, #1e1b4b 100%);
        }

        .theme-roxo-neon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(192, 132, 252, 0.2), transparent 50%);
        }

        /* 2. Plasma Cônicos */
        .theme-plasma-conico {
            background: conic-gradient(from var(--angle), #8b5cf6, #ec4899, #ef4444, #f59e0b, #22c55e, #06b6d4, #8b5cf6);
            animation: rotateAngle 8s linear infinite;
        }

        /* 3. Lava Vulcão */
        .theme-lava-vulcao {
            background: #450a0a;
        }

        .theme-lava-vulcao::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #b91c1c, transparent);
            animation: hazardPulse 3s ease-in-out infinite;
        }

        /* 4. Matrix Grid */
        .theme-matrix-grid {
            background: #000a00;
            background-image: linear-gradient(rgba(16, 185, 129, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 185, 129, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .theme-matrix-grid::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.3), transparent);
            animation: matrixScan 4s linear infinite;
        }

        /* 5. Nebulosa */
        .theme-nebulosa {
            background: radial-gradient(circle at center, #1e1b4b, #000000);
        }

        .theme-nebulosa::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(ellipse at center, rgba(192, 132, 252, 0.15), rgba(236, 72, 153, 0.1), transparent 70%);
            animation: spiral 20s linear infinite;
        }

        /* 6. Titan Core (Reverted to original) */
        .theme-titan-core {
            background: #1c1917;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0z' fill='%23292524'/%3E%3Cpath d='M0 20h40M20 0v40' stroke='%23444' stroke-width='1'/%3E%3C/svg%3E");
        }

        .theme-titan-core::after {
            content: 'settings';
            font-family: 'Material Symbols Outlined';
            position: absolute;
            top: 10%;
            right: 10%;
            font-size: 120px;
            color: rgba(255, 255, 255, 0.05);
            animation: rotateAngle 15s linear infinite;
        }

        /* 7. Stealth Ops (Preserved) */
        .theme-stealth-ops {
            background: #0a0a0a;
            background-image: radial-gradient(#14532d 0.5px, transparent 0.5px);
            background-size: 15px 15px;
        }

        .theme-stealth-ops::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 20%;
            width: 300%;
            height: 300%;
            transform: translate(-50%, -50%);
            background: conic-gradient(from var(--angle), rgba(34, 197, 94, 0.3) 0deg, transparent 60deg);
            animation: rotateAngle 4s linear infinite;
        }

        /* 8. Glacial (Preserved) */
        .theme-glacial {
            background: linear-gradient(135deg, #0c4a6e, #0ea5e9, #bae6fd);
        }

        .theme-glacial::after {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
            opacity: 0.3;
            mix-blend-mode: overlay;
            animation: frostSpread 5s ease-in-out infinite;
        }

        /* 9. Cyber Pulse (Redesign High-Fidelity) */
        .theme-cyber-pulse {
            background: #000913;
            position: relative;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .theme-cyber-pulse::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 20px 20px;
            z-index: 0;
        }

        .theme-cyber-pulse::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 30%;
            width: 2px;
            background: #0ff;
            box-shadow: 0 0 15px 2px #0ff;
            animation: lightningPulse 2s infinite;
            z-index: 1;
        }

        /* 10. Gold Rush (Preserved) */
        .theme-gold-rush {
            background: linear-gradient(90deg, #451a03, #ca8a04, #fef08a, #ca8a04, #451a03);
            background-size: 200% 100%;
            animation: goldFlow 6s linear infinite;
        }

        /* 11. Solar Flare (Redesign High-Fidelity) */
        .theme-solar-flare {
            background: radial-gradient(circle at 80% 120%, #ff0000 0%, #ff6600 30%, #330000 80%, #000 100%);
        }

        .theme-solar-flare::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: 50%;
            left: 50%;
            margin-top: -75%;
            margin-left: -75%;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.4) 0%, transparent 60%);
            animation: solarEruption 4s ease-in-out infinite;
            mix-blend-mode: screen;
        }

        /* 12. Deep Void (Abyssal Watcher) */
        .theme-deep-void {
            background: #0a0014;
            overflow: hidden;
        }

        .theme-deep-void::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 75% 40%, #fff 0px, transparent 8px), radial-gradient(circle at 75% 40%, #c084fc 0px, transparent 35px), radial-gradient(circle at 25% 60%, #fff 0px, transparent 6px), radial-gradient(circle at 25% 60%, #6d28d9 0px, transparent 25px);
            background-size: 200px 200px;
            animation: abyssalEye 5s ease-in-out infinite alternate;
            opacity: 0.7;
            mix-blend-mode: screen;
            z-index: 0;
        }

        .theme-deep-void::after {
            content: '';
            position: absolute;
            inset: -30%;
            background: repeating-linear-gradient(60deg, transparent, transparent 30px, rgba(109, 40, 217, 0.15) 30px, rgba(109, 40, 217, 0.15) 60px);
            filter: blur(8px);
            animation: tentacleWrithe 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        /* 13. Biohazard (Viral Infection) */
        .theme-biohazard {
            background: #1a1a1c;
            overflow: hidden;
        }

        .theme-biohazard::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(30deg, transparent 40%, rgba(220, 38, 38, 0.15) 45%, rgba(220, 38, 38, 0.3) 50%, rgba(220, 38, 38, 0.15) 55%, transparent 60%), linear-gradient(-30deg, transparent 40%, rgba(220, 38, 38, 0.15) 45%, rgba(220, 38, 38, 0.3) 50%, rgba(220, 38, 38, 0.15) 55%, transparent 60%);
            background-size: 80px 140px;
            animation: viralPulse 3.5s ease-in-out infinite;
            mix-blend-mode: color-dodge;
            z-index: 0;
        }

        .theme-biohazard::after {
            content: '';
            position: absolute;
            inset: -50%;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(239, 68, 68, 0.1) 20px, rgba(239, 68, 68, 0.1) 22px), repeating-linear-gradient(-45deg, transparent, transparent 30px, rgba(255, 100, 100, 0.08) 30px, rgba(255, 100, 100, 0.08) 32px);
            animation: dnaScroll 12s linear infinite;
            z-index: 0;
        }

        /* 14. Bloodline (Redesign High-Fidelity) */
        .theme-bloodline {
            background: #1a0505;
            animation: vampiricHeartbeat 2.5s infinite;
        }

        .theme-bloodline::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
        }

        /* 15. Starlight (Redesign High-Fidelity) */
        .theme-starlight {
            background: #010008;

            content: '';

        .theme-starlight::after {

        /* --- 5 New Themes --- */
        /* 16. Inferno Engine */

            background-size: 300% 300%;
            animation: lavaFlow 8s ease infinite, heatDistort 3s infinite alternate;
        }

        .theme-inferno-engine::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 100%, rgba(253, 224, 71, 0.6) 1px, transparent 2px), radial-gradient(circle at 30% 100%, rgba(251, 146, 60, 0.6) 2px, transparent 3px), radial-gradient(circle at 70% 100%, rgba(254, 240, 138, 0.6) 1.5px, transparent 2.5px);

            mix-blend-mode: screen;
        }

        /* 17. Quantum Weaver */
        .theme-quantum-weaver {
            background: #083344;
            position: relative;
            animation: glitchTear 5s infinite;
        }

        .theme-quantum-weaver::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(6, 182, 212, 0.2) 10px, rgba(6, 182, 212, 0.2) 12px);
            animation: cyberPulseLines 2s linear infinite;
        }

        .theme-quantum-weaver::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 40px rgba(6, 182, 212, 0.5);
        }

        /* 18. Stormbringer */
        .theme-stormbringer {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 200% 200%;
            animation: stormClouds 10s ease-in-out infinite alternate;
            position: relative;
        }

        .theme-stormbringer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.8) 0%, transparent 40%);
            opacity: 0;
            animation: lightningStrike 6s infinite;
            mix-blend-mode: overlay;
            z-index: 1;
        }

        /* 19. Void Reaver */
        .theme-void-reaver {
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .theme-void-reaver::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            margin-top: -100px;
            margin-left: -100px;
            background: radial-gradient(circle, #000 20%, #4c1d95 60%, transparent 100%);
            box-shadow: 0 0 50px #8b5cf6;
            border-radius: 50%;
            animation: singularityPull 4s linear infinite;
            z-index: 0;
        }

        .theme-void-reaver::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(2px 2px at 20% 20%, #d8b4fe, transparent), radial-gradient(2px 2px at 80% 80%, #d8b4fe, transparent), radial-gradient(1px 1px at 30% 70%, #d8b4fe, transparent), radial-gradient(3px 3px at 70% 30%, #d8b4fe, transparent);
            background-size: 100px 100px;
            animation: particleSuck 3s ease-in infinite;
            z-index: 0;
        }

        /* 20. Emerald Dragon */
        .theme-emerald-dragon {
            background: linear-gradient(135deg, #064e3b, #047857, #064e3b);

            overflow: hidden;

        .theme-emerald-dragon::before {
            content: '';
            position: absolute;
            top: 30%;
            right: 15%;
            width: 24px;
            height: 12px;
            border-radius: 50%;
            background: #a3e635;

            animation: dragonBlink 6s infinite;
            filter: blur(1px);
        }

        .theme-emerald-dragon::after {
            content: '';
            position: absolute;
            inset: -50%;

            background: linear-gradient(to top, #020617, #1e3a8a, #3b82f6);

            filter: blur(2px);
            mix-blend-mode: screen;

        /* 22. Neon Samurai */
        .theme-neon-samurai {
            background: #09090b;
            position: relative;
            overflow: hidden;
        }

        .theme-neon-samurai::before {

            left: 0;

        .theme-ghost-protocol {

        .theme-solar-eclipse {
            background: #000;
            position: relative;
            overflow: hidden;

            left: 50%;

        }

        .theme-solar-eclipse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;

            z-index: 1;
        }

        /* 26. Cyber Iris */
        .theme-cyber-iris {
            background: #020617;
            position: relative;
            overflow: hidden;
            border: 1px solid #10b981;
        }

        .theme-cyber-iris::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-left: -50px;
            border: 2px solid #34d399;
            border-radius: 50%;
            background: radial-gradient(circle, #059669 20%, transparent 60%);
            box-shadow: 0 0 20px #10b981;
            animation: singularitySpin 10s infinite linear;
            z-index: 0;
        }

        .theme-cyber-iris::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #6ee7b7;
            box-shadow: 0 0 10px #6ee7b7;
            animation: scanLine 3s infinite linear;
            z-index: 1;
        }

        /* 27. Frozen Throne */
        .theme-frozen-throne {
            background: linear-gradient(to bottom, #0c4a6e, #e0f2fe);
            position: relative;
            overflow: hidden;
        }

        .theme-frozen-throne::before {
            content: '';
            position: absolute;
            inset: -20%;
            background-image: radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.8), transparent 70%);
            filter: blur(5px);
            animation: creepingFrost 6s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        /* 28. Nuclear Winter */
        .theme-nuclear-winter {
            background: #064e3b;
            position: relative;
            overflow: hidden;
        }

        .theme-nuclear-winter::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, transparent 70%);
            animation: hazardPulse 4s infinite;
        }

        .theme-nuclear-winter::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(1px 1px at 50% 50%, #fff, transparent);
            background-size: 20px 20px;
            animation: ashFall 3s infinite linear;
            opacity: 0.5;
        }

        /* 29. Dimension Warp */
        .theme-dimension-warp {
            background: #1e1b4b;
            position: relative;
            overflow: hidden;
        }

        .theme-dimension-warp::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-radial-gradient(circle, transparent, transparent 20px, rgba(139, 92, 246, 0.3) 20px, rgba(139, 92, 246, 0.3) 40px);

            z-index: 0;
        }

        /* 30. Ancient Rune */
        .theme-ancient-rune {
            background: #1c1917;
            position: relative;
            overflow: hidden;
        }

        .theme-ancient-rune::before {
            content: 'ᛟ ᚲ ᚫ ᚢ ᚱ';

            font-size: 64px;
            color: #f59e0b;

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            animation: runeGlow 4s infinite alternate;
            opacity: 0.5;
        }


        /* UI Elements */
        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .variant-btn {
            background: rgba(10, 5, 20, 0.8);

        }

        .variant-btn:hover,
        .variant-btn.active {
            background: rgba(139, 92, 246, 0.2);

            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);

            color: #cbc3d7;

        }

        .tab-btn.active {
            color: #c084fc;
            border-bottom-color: #c084fc;
            background: rgba(139, 92, 246, 0.1);
        }
    </style>
</head>

<body class="font-body-md antialiased min-h-screen flex flex-col">

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 5, 20, 0.4);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.8);
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const previewCard = document.getElementById('previewCard');
            const variantBtns = document.querySelectorAll('.variant-btn');

            variantBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all buttons
                    variantBtns.forEach(b => b.classList.remove('active', 'text-primary'));
                    // Add active class to clicked button
                    btn.classList.add('active', 'text-primary');

                    // Remove all theme classes from preview card
                    previewCard.className = 'banner-base w-full max-w-3xl h-[240px] md:h-[280px] rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.6)] flex items-end p-6 md:p-8 mb-12';

                    // Add selected theme class
                    const theme = btn.getAttribute('data-theme');
                    previewCard.classList.add(theme);
                });
            });
        });
    </script>
