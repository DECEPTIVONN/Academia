

    <!-- ====== MODAL: CONFIGURAR CARDIO (AERÓBICO) ====== -->
    <div class="modal-overlay" id="modalAerobico" style="display:none">
        <div class="modal-form">
            <div class="modal-form-header">
                <h3 id="modalAeTitulo">Configurar Cardio</h3>
                <button class="modal-close-btn" onclick="closeModal('modalAerobico')" aria-label="Fechar">✕</button>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label for="inputAeTipo">Tipo de Exercício *</label>
                <select id="inputAeTipo" style="width: 100%; padding: 12px; border-radius: 12px; background: #111; color: #fff; border: 1px solid rgba(255,255,255,0.1); outline: none; appearance: none;">
                    <option value="">Selecione...</option>
                    <option value="Esteira">Esteira</option>
                    <option value="Bicicleta">Bicicleta</option>
                    <option value="Elíptico">Elíptico</option>
                    <option value="Corda">Pular Corda</option>
                    <option value="Escada">Escada</option>
                    <option value="Corrida de Rua">Corrida de Rua</option>
                    <option value="Remo">Remo Ergométrico</option>
                    <option value="Outro">Outro Cardio</option>
                </select>
            </div>
            <div class="form-row" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="inputAeTempo">Duração (min) *</label>
                    <input type="number" id="inputAeTempo" placeholder="Ex: 20" min="1" max="180">
                </div>
                <div class="form-group">
                    <label for="inputAeVel">Velocidade Média (km/h)</label>
                    <input type="text" id="inputAeVel" placeholder="Ex: 8.5">
                </div>
            </div>
            <div class="form-actions" style="margin-top: 25px;">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalAerobico')">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnSalvarAerobico">Salvar Cardio</button>
            </div>
        </div>
    </div>

    <!-- ====== MODAL: CLASH ROYALE STYLE DETAILS ====== -->
    <div class="modal-overlay" id="modalCRDetails" style="display:none">
        <div class="cr-card-details">
            <!-- Close Button -->
            <button class="cr-close" onclick="closeModal('modalCRDetails')" aria-label="Fechar">✕</button>
            
            <!-- Header Section -->
            <div class="cr-card-header">
                <div class="cr-top-main">
                    <!-- Miniature Card -->
                    <div class="cr-card-miniature">
                        <div class="cr-card-level-badge">Lvl <span id="crExLevel">1</span></div>
                        <img id="crExCardImg" src="" alt="Imagem do Exercício">
                    </div>
                    <!-- Header Info -->
                    <div class="cr-header-info">
                        <h2 id="crExName">Nome do Exercício</h2>
                        <div class="cr-ex-level-text">Nível <span id="crExLevelLabel">1</span></div>
                        
                        <div class="cr-rarity-type-wrap" style="display: flex; gap: 10px; align-items: center;">
                            <!-- Maestria Shortcut -->
                            <button class="cr-maestria-shortcut" id="crExMaestriaIcon" title="Ver Maestria">
                                🏆
                            </button>
                            <!-- Info Box 1 -->
                            <div class="cr-info-box">
                                <span class="cr-info-label">Músculo</span>
                                <span class="cr-info-val" id="crExGrupo">Peito</span>
                            </div>
                            <!-- Info Box 2 -->
                            <div class="cr-info-box">
                                <span class="cr-info-label">Tipo</span>
                                <span class="cr-info-val" id="crExClasse">Aparelho</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Card Body with Tabs -->
            <div class="cr-card-body">
                <div class="cr-tabs-container" style="position: relative; width: 100%; height: 100%;">
                    <!-- Tab 1: Info/Descrição -->
                    <div class="cr-tab-pane active">
                        <div class="cr-description-box" id="crExDescription">
                            Descrição e anotações do exercício.
                        </div>
                    </div>
                    
                    <!-- Tab 2: Stats Grid -->
                    <div class="cr-tab-pane">
                        <div class="cr-stats-grid" id="crStatsGrid">
                            <!-- Preenchido dinamicamente via JS -->
                        </div>
                    </div>
                    
                    <!-- Tab 3: Ilustração/GIF -->
                    <div class="cr-tab-pane">
                        <div class="cr-illustration-frame">
                            <img id="crExIllustration" src="" alt="Demonstração">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Footer (Swipe Navigation Dots) -->
            <div class="cr-card-footer" style="text-align: center;">
                <div class="cr-dots-indicator" style="display: inline-flex; gap: 8px; justify-content: center; margin-bottom: 20px;">
                    <span class="cr-dot active" style="width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); display: inline-block; cursor: pointer; transition: 0.3s;"></span>
                    <span class="cr-dot" style="width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); display: inline-block; cursor: pointer; transition: 0.3s;"></span>
                    <span class="cr-dot" style="width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); display: inline-block; cursor: pointer; transition: 0.3s;"></span>
                </div>
                <div class="cr-footer-actions">
                    <button class="btn btn-secondary cr-btn-upgrade" id="crExEditBtn" style="width: 100%; font-weight: 700;">
                        <span class="cr-btn-text">✏️ EDITAR EXERCÍCIO</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
